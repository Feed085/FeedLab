<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none">
  <rect width="640" height="400" fill="#F1F5F9"/>
  <!-- PCB Board -->
  <rect x="110" y="68" width="420" height="264" rx="16" fill="#0F172A" stroke="#334155" stroke-width="3"/>
  <!-- Traces -->
  <g stroke="#147DF5" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M160 120 H245 V160"/>
    <path d="M160 150 H225 V180 H245"/>
    <path d="M160 220 H245"/>
    <path d="M395 160 H470 V120"/>
    <path d="M395 200 H480"/>
    <path d="M320 110 V140"/>
    <path d="M320 260 V290"/>
  </g>
  <!-- STM32 QFP Chip -->
  <rect x="260" y="140" width="120" height="120" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <rect x="278" y="158" width="84" height="84" rx="4" fill="#334155"/>
  <!-- Oscilloscope waveform inside -->
  <path d="M286 202 L302 202 L310 178 L322 224 L334 186 L342 202 L354 202" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Gold pins -->
  <g fill="#F59E0B">
    <rect x="245" y="154" width="15" height="6" rx="2"/><rect x="245" y="174" width="15" height="6" rx="2"/><rect x="245" y="194" width="15" height="6" rx="2"/><rect x="245" y="214" width="15" height="6" rx="2"/><rect x="245" y="234" width="15" height="6" rx="2"/>
    <rect x="380" y="154" width="15" height="6" rx="2"/><rect x="380" y="174" width="15" height="6" rx="2"/><rect x="380" y="194" width="15" height="6" rx="2"/><rect x="380" y="214" width="15" height="6" rx="2"/><rect x="380" y="234" width="15" height="6" rx="2"/>
  </g>
  <!-- SMD pads & holes -->
  <circle cx="144" cy="102" r="8" fill="#F1F5F9" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="496" cy="102" r="8" fill="#F1F5F9" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="144" cy="298" r="8" fill="#F1F5F9" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="496" cy="298" r="8" fill="#F1F5F9" stroke="#F59E0B" stroke-width="3"/>
</svg>
